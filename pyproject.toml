[project]
name = "career-ops-python"
version = "1.0.0"
description = "Python CLI tools for career-ops pipeline management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.12",
]

[project.scripts]
career-ops = "career_ops.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
